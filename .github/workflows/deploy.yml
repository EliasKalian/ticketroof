name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site with minified CSS and JS
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
          npx --yes esbuild@0.24.0 style.css --minify --outfile=_site/style.css --allow-overwrite
          npx --yes esbuild@0.24.0 main.js --minify --outfile=_site/main.js --allow-overwrite

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
