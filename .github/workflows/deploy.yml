name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Redeploy on the 1st of every month so the footer date stays current
    - cron: '0 3 1 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build tools
        run: npm ci

      - name: Build site (blog, minified CSS/JS, inline CSS, footer date, main.js hash)
        run: npm run build

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow (Bing, Yandex, Seznam, Naver)
        continue-on-error: true
        env:
          INDEXNOW_KEY: 35d354af1d6f98e72eeca5ca80b5ec46
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' _site/sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##' | jq -R . | jq -sc .)
          payload=$(jq -nc --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: "ticket-roof.com", key: $key, keyLocation: "https://ticket-roof.com/\($key).txt", urlList: $urls}')
          echo "$payload"
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$payload")
          cat response.txt
          echo "IndexNow responded with HTTP $status"
          [ "$status" = 200 ] || [ "$status" = 202 ]
